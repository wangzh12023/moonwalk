name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The end-to-end scripts use Node's built-in fetch and WebSocket.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Toolchain
        run: |
          moon version --all
          moon update

      - name: Check (all backends)
        run: moon check --target all

      - name: Test (wasm-gc, wasm, js)
        run: |
          moon test --target wasm-gc
          moon test --target wasm
          moon test --target js

      - name: Viewer bundle is up to date
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/build-viewer.sh --check

      - name: Format and public interfaces are up to date
        if: runner.os == 'Linux'
        run: |
          moon fmt --check
          moon info
          git diff --exit-code -- '*.mbti'

      - name: End-to-end - record and explain the bank example
        shell: bash
        run: |
          moon build cmd/moonwalk --target wasm --release
          MW=_build/wasm/release/build/cmd/moonwalk/moonwalk.wasm
          moonrun "$MW" -- -C examples/bank -q record --steps 20 --html bank.html
          moonrun "$MW" -- -C examples/bank -q why | tee why.txt
          grep -q "self.balance = 296" why.txt
          grep -q "fee_for" why.txt
          test -s bank.html

      - name: End-to-end - the viewer works in a real browser
        shell: bash
        run: node scripts/viewer-check.mjs bank.html

      - name: End-to-end - MCP server answers like an agent expects
        shell: bash
        run: |
          node scripts/mcp-smoke.mjs _build/wasm/release/build/cmd/moonwalk/moonwalk.wasm examples/inventory partially

      - name: End-to-end - every regression test records and still passes
        shell: bash
        run: |
          MW=_build/wasm/release/build/cmd/moonwalk/moonwalk.wasm
          moon -C examples/regressions test --target wasm-gc
          moonrun "$MW" -- -C examples/regressions -q record --steps 0 --json reg.json
          node -e '
            const r = JSON.parse(require("fs").readFileSync("reg.json", "utf8"));
            const bad = r.tests.filter(t => !t.passed || t.steps.length === 0);
            for (const t of r.tests) console.log(t.passed ? "PASS" : "FAIL", t.steps.length, t.name);
            if (r.tests.length < 10 || bad.length) process.exit(1);
          '

  # The install path the README recommends: `moon install` builds a native
  # executable. Exercise it end to end on every system.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # Native MoonBit programs are compiled with MSVC on Windows.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: moon install
        shell: bash
        run: |
          moon update
          moon install ./cmd/moonwalk --bin "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: End-to-end - native CLI and MCP server
        shell: bash
        run: |
          moonwalk --help
          moonwalk -C examples/bank -q why | tee why.txt
          grep -q "self.balance = 296" why.txt
          moonwalk -C examples/regressions -q record --steps 0 --json reg.json
          node -e '
            const r = JSON.parse(require("fs").readFileSync("reg.json", "utf8"));
            const bad = r.tests.filter(t => !t.passed || t.steps.length === 0);
            console.log(r.tests.length, "tests recorded,", bad.length, "bad");
            if (r.tests.length < 10 || bad.length) process.exit(1);
          '
          node scripts/mcp-smoke.mjs "$(command -v moonwalk)" examples/inventory partially
